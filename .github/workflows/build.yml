name: Build Velvet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Распаковать Velvet.zip
        run: |
          unzip -q Velvet.zip -d velvet-project

          if [ -f "velvet-project/gradlew" ]; then
            echo "PROJECT_DIR=velvet-project" >> "$GITHUB_ENV"
          elif [ -f "velvet-project/Velvet/gradlew" ]; then
            echo "PROJECT_DIR=velvet-project/Velvet" >> "$GITHUB_ENV"
          else
            echo "ОШИБКА: gradlew не найден"
            find velvet-project -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Проверить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          adb --version
          sdkmanager --list_installed | head -50

      - name: Подготовить Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Собрать Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Найти APK
        run: |
          echo "APK:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
